<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 99 — Follow-Up</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B2A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The 99">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">
<!-- The first API call is the slowest thing on the page; warm the connection now. -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/the99.css">
</head>
<body>

<!-- ── SIGN-IN GATE ────────────────────────────────────────────────────── -->
<div class="gate" id="gate" hidden>
  <div class="gate-emblem">🐑</div>
  <div class="gate-brand">The 99</div>
  <div class="gate-sub">St. Mark Youth Follow-Up</div>
  <div class="gate-verse" id="gate-verse"></div>
  <div class="gate-ref"   id="gate-ref"></div>
  <div class="gate-btn-wrap" id="gsi-button"></div>
  <p class="gate-note">Sign in with the Google account registered on the Servants sheet.</p>
  <p class="gate-error" id="gate-error" hidden></p>
</div>

<!-- ── APP ─────────────────────────────────────────────────────────────── -->
<div id="app" hidden>

  <div class="offline-bar" id="offlineBar" hidden>⚠ You are offline — saving is paused</div>

  <div class="header">
    <div class="header-title">
      <span class="header-title__pad"></span>
      <span class="header-mark">
        <span class="header-emblem">🐑</span>
        <span class="header-brand">The 99</span>
      </span>
      <span class="header-tools" id="header-tools"></span>
    </div>
    <div class="header-servant">Servant: <strong id="servantName"></strong></div>
    <nav class="nav" id="nav" hidden></nav>
  </div>

  <div class="verse-box">
    <div class="verse-tag">Today's Word</div>
    <div class="verse-text" id="verseText"></div>
    <div class="verse-ref"  id="verseRef"></div>
  </div>

  <div class="birthday-box" id="birthdayBox" hidden>
    <div class="birthday-head">🎂 <span id="birthdayHead">Birthdays this week</span></div>
    <ul class="birthday-list" id="birthdayList"></ul>
  </div>

  <div class="summary" id="summary"></div>

  <div class="lost-banner" id="lostBanner" hidden>
    <span class="emoji">🕯️</span><span id="lostBannerText"></span>
  </div>

  <div class="filter-bar" id="filterBar" hidden>
    <input class="search-box" id="searchBox" type="search" dir="auto"
           placeholder="🔍  Search name, area, university…" autocomplete="off">
    <div class="filter-line">
      <select class="filter-select" id="sortBy">
        <option value="urgent">Most overdue first</option>
        <option value="name">Name A–Z</option>
        <option value="recent">Recently reached</option>
        <option value="year">Year</option>
      </select>
      <span class="filter-count" id="filterCount"></span>
    </div>
    <div class="filter-line" id="filterRow2" hidden>
      <select class="filter-select" id="fYear"><option value="">All years</option></select>
      <select class="filter-select" id="fGender"><option value="">All</option>
        <option value="Female">Female</option><option value="Male">Male</option></select>
      <select class="filter-select" id="fServant"><option value="">All servants</option></select>
    </div>
  </div>

  <div class="container" id="cards">
    <div class="page-loading">
      <div class="page-loading-ring"></div>
      <div class="page-loading-text">Gathering the flock…</div>
    </div>
    <div class="skeleton-card"><div class="sk h-big w-3q"></div><div class="sk h-small w-half"></div><div class="sk h-small w-full"></div></div>
    <div class="skeleton-card"><div class="sk h-big w-3q"></div><div class="sk h-small w-half"></div><div class="sk h-small w-full"></div></div>
    <div class="skeleton-card"><div class="sk h-big w-3q"></div><div class="sk h-small w-half"></div><div class="sk h-small w-full"></div></div>
  </div>
</div>

<div class="reload-overlay" id="reloadOverlay">
  <div class="reload-spinner"></div>
  <p>Searching for the lost…</p>
</div>

<script src="config.js"></script>
<script src="assets/the99.js"></script>
<script>
(function () {
  var FLOCK = [];          // every youth in this flock
  var SERVANT_NAME = '';   // whose flock is on screen
  var CAN_EDIT = false;    // own flock, or a leader
  var stateFilter = '';    // '', 'ok', 'warn', 'late' — driven by the chips

  setRandomVerse();

  var Q = new URLSearchParams(location.search);
  var VIEW = Q.get('view') === 'class' ? 'class'
           : Q.get('view') === 'all'   ? 'all'
           : 'mine';
  var CLASS_VIEW = VIEW === 'class';
  var BIG_VIEW   = VIEW !== 'mine';          // hundreds of youths, not dozens

  // What was asked for, so a refresh after logging re-asks the same thing.
  var FLOCK_REQUEST = {};
  var FLOCK_CACHE_KEY = '';

  var gate = VIEW === 'class' ? { classOnly: true }
           : VIEW === 'all'   ? { leaderOnly: true }
           : {};

  requireServant(gate).then(function (ctx) {
    var role = ctx.boot.user.role || (ctx.boot.user.isLeader ? 'leader' : 'servant');
    var head = document.querySelector('.header-servant');

    if (VIEW === 'all') {
      SERVANT_NAME = ctx.boot.user.name;
      CAN_EDIT = true;
      document.getElementById('sortBy').value = 'name';   // a directory reads A–Z
      loadFlock('all', { view: 'all' }, function (data) {
        head.innerHTML = 'All youths · <strong>' + (data.youths || []).length + '</strong>';
      });
      return;
    }

    if (VIEW === 'class') {
      SERVANT_NAME = ctx.boot.user.name;
      CAN_EDIT = false;                                      // look, do not touch
      loadFlock('class', { view: 'class' }, function (data) {
        head.innerHTML = 'Class: <strong>' + escHtml(data.label || 'my class') + '</strong>';
      });
      return;
    }

    // The ministry leader may open another shepherd's flock: ?servant=Name
    var asked = Q.get('servant');
    SERVANT_NAME = (role === 'leader' && asked) ? asked.trim() : ctx.boot.user.name;
    CAN_EDIT = (role === 'leader') || SERVANT_NAME === ctx.boot.user.name;
    document.getElementById('servantName').textContent = SERVANT_NAME;
    loadFlock('flock.' + SERVANT_NAME, { servant: SERVANT_NAME }, null);
  });

  function loadFlock(cacheKey, request, onHeader) {
    FLOCK_REQUEST = request;
    FLOCK_CACHE_KEY = cacheKey;
    apiCached(cacheKey, 'flock', request,
      function (data) {
        FLOCK = data.youths || [];
        if (onHeader) onHeader(data);
        document.getElementById('filterBar').hidden = FLOCK.length === 0;
        populateFilters();
        renderBirthdays();
        renderSummary();
        renderCards();
      },
      function (err) {
        document.getElementById('cards').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>' + escHtml(err.message) + '</p></div>';
      });
  }

  /* Year / Gender / Servant only earn their space on the big views. */
  function populateFilters() {
    var row = document.getElementById('filterRow2');
    if (!BIG_VIEW) { row.hidden = true; return; }
    row.hidden = false;

    var years = {}, servants = {};
    FLOCK.forEach(function (y) {
      if (y.Year) years[y.Year] = true;
      if (y.Servant_Name) servants[String(y.Servant_Name).trim()] = true;
    });
    var fy = document.getElementById('fYear'), fs = document.getElementById('fServant');
    fy.innerHTML = '<option value="">All years</option>' +
      Object.keys(years).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); })
        .map(function (v) { return '<option value="' + escHtml(v) + '">Year ' + escHtml(v) + '</option>'; }).join('');
    fs.innerHTML = '<option value="">All servants</option>' +
      Object.keys(servants).sort()
        .map(function (v) { return '<option value="' + escHtml(v) + '">' + escHtml(v) + '</option>'; }).join('');
    // A class is one gender already; the control would only ever have one answer.
    document.getElementById('fGender').hidden = CLASS_VIEW;
  }

  /* ── BIRTHDAYS ─────────────────────────────────────────────────────── */

  var BIRTHDAYS = [];      // ids with a birthday in the window, for the card badge

  function renderBirthdays() {
    var soon = upcomingBirthdays(FLOCK);
    var box = document.getElementById('birthdayBox');

    BIRTHDAYS = soon.map(function (b) { return b.youth.Youth_ID; });

    if (!soon.length) { box.hidden = true; return; }
    box.hidden = false;

    var todayCount = soon.filter(function (b) { return b.birthday.daysAway === 0; }).length;
    document.getElementById('birthdayHead').textContent = todayCount
      ? (todayCount === 1 ? 'A birthday today' : todayCount + ' birthdays today')
      : 'Birthdays this week';

    // Across the whole ministry a week can hold a dozen birthdays; the panel
    // is a prompt, not a register, so it shows the first few and says how
    // many more there are. A servant's own flock rarely reaches the cap.
    var CAP = 6;
    var extra = soon.length > CAP ? soon.length - CAP : 0;
    var shownSoon = extra ? soon.slice(0, CAP) : soon;

    document.getElementById('birthdayList').innerHTML = shownSoon.map(function (b) {
      var y = b.youth, info = b.birthday;
      var wa = cleanPhone(y.Mobile);
      // Arabic agrees with gender; the masculine form for a young woman reads
      // as carelessness, so pick the right one from the sheet. Unknown gender
      // falls back to a greeting that needs no agreement at all.
      var first = String(y.Full_Name || '').split(/\s+/)[0];
      var g = String(y.Gender || '').trim().toLowerCase();
      var greeting = encodeURIComponent(
        g === 'female' ? 'كل سنة وانتي طيبة يا ' + first + ' 🎉'
      : g === 'male'   ? 'كل سنة وانت طيب يا '  + first + ' 🎉'
      :                  'كل سنة وانت طيب / وانتي طيبة يا ' + first + ' 🎉');

      return '<li class="birthday-item' + (info.daysAway === 0 ? ' is-today' : '') + '">' +
        '<span class="birthday-when">' + escHtml(info.shortLabel) + '</span>' +
        '<span class="birthday-who">' +
          '<span class="birthday-name" dir="auto">' + escHtml(y.Full_Name || '') + '</span>' +
          '<span class="birthday-age">' +
            (info.turning ? 'turning ' + info.turning : 'birthday') +
            (y.Year ? ' · Year ' + escHtml(y.Year) : '') +
          '</span>' +
        '</span>' +
        (wa ? '<a class="birthday-wish" href="https://wa.me/' + wa + '?text=' + greeting +
              '" target="_blank" rel="noopener">💬 Wish</a>' : '') +
      '</li>';
    }).join('') + (extra
      ? '<li class="birthday-more">and ' + extra + ' more this week — search a name to find them</li>'
      : '');
  }

  /* ── SUMMARY CHIPS (also the state filter) ─────────────────────────── */

  function renderSummary() {
    var ok = 0, warn = 0, late = 0;
    FLOCK.forEach(function (y) {
      var s = flockState(daysSince(y.Latest_Followup));
      if (s === 'late') late++; else if (s === 'warn') warn++; else ok++;
    });

    document.getElementById('summary').innerHTML =
      chip('ok',   ok,   'In the Fold') +
      chip('warn', warn, 'Wandering')   +
      chip('late', late, 'Lost Sheep');

    var banner = document.getElementById('lostBanner');
    if (late > 0) {
      banner.hidden = false;
      document.getElementById('lostBannerText').textContent =
        late === 1 ? 'One sheep is lost. Go after it.'
                   : late + ' sheep are lost. Go after them.';
    } else {
      banner.hidden = true;
    }

    Array.prototype.forEach.call(
      document.querySelectorAll('.summary-chip'), function (b) {
        b.addEventListener('click', function () {
          stateFilter = (stateFilter === b.dataset.state) ? '' : b.dataset.state;
          renderSummary();
          renderCards();
        });
      });
  }

  function chip(state, count, label) {
    return '<button class="summary-chip chip-' + state + '" type="button" ' +
           'data-state="' + state + '" aria-pressed="' + (stateFilter === state) + '">' +
           '<span class="chip-count">' + count + '</span>' +
           '<span class="chip-label">' + label + '</span></button>';
  }

  /* ── CARD LIST ─────────────────────────────────────────────────────── */

  function visibleYouths() {
    var q = document.getElementById('searchBox').value.trim().toLowerCase();
    var fYear = document.getElementById('fYear').value;
    var fGender = document.getElementById('fGender').value;
    var fServant = document.getElementById('fServant').value;
    var rows = FLOCK.filter(function (y) {
      if (stateFilter && flockState(daysSince(y.Latest_Followup)) !== stateFilter) return false;
      if (fYear && String(y.Year) !== fYear) return false;
      if (fGender && String(y.Gender).trim() !== fGender) return false;
      if (fServant && String(y.Servant_Name || '').trim() !== fServant) return false;
      return matchesQuery(y, q);
    });

    // Never-reached sorts as infinitely overdue, the same way it displays.
    function urgency(y) {
      var d = daysSince(y.Latest_Followup);
      return d === null ? Infinity : d;
    }
    var sort = document.getElementById('sortBy').value;
    if (sort === 'urgent')      rows.sort(function (a, b) { return urgency(b) - urgency(a); });
    else if (sort === 'recent') rows.sort(function (a, b) { return urgency(a) - urgency(b); });
    else if (sort === 'year')   rows.sort(function (a, b) {
      return String(a.Year).localeCompare(String(b.Year), undefined, { numeric: true }) ||
             String(a.Full_Name).localeCompare(String(b.Full_Name));
    });
    else rows.sort(function (a, b) {
      return String(a.Full_Name).localeCompare(String(b.Full_Name));
    });
    return rows;
  }

  /* Two things keep this quick at hundreds of youths:
       1. only the first PAGE cards are put in the DOM, more arriving as you
          scroll (or on a tap of "Show more");
       2. a card is rendered as its header only — the details, notes box and
          reach-out form are built the first time that card is opened.
     Together they cut the initial DOM by roughly 95% on a 450-youth list. */
  var PAGE = 40;
  var VISIBLE = [];        // every youth matching the current search/filters
  var shown = 0;           // how many of VISIBLE are currently in the DOM
  var sentinelObserver = null;

  function renderCards() {
    var container = document.getElementById('cards');
    container.innerHTML = '';
    shown = 0;
    if (sentinelObserver) { sentinelObserver.disconnect(); sentinelObserver = null; }

    if (!FLOCK.length) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🐑</div><p>No youth assigned yet.</p></div>';
      document.getElementById('filterCount').textContent = '';
      return;
    }

    VISIBLE = visibleYouths();
    document.getElementById('filterCount').textContent = VISIBLE.length + ' of ' + FLOCK.length;

    if (!VISIBLE.length) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No one matches that search.</p></div>';
      return;
    }

    if (CLASS_VIEW) {
      container.innerHTML =
        '<div class="lost-banner" style="margin:0 0 4px"><span class="emoji">👀</span>' +
        '<span>Viewing your whole class. Reach-outs and notes are recorded by ' +
        'each youth&#39;s own servant.</span></div>';
    }
    appendMore();
  }

  function appendMore() {
    var container = document.getElementById('cards');
    var old = document.getElementById('showMore');
    if (old) old.remove();

    var next = Math.min(VISIBLE.length, shown + PAGE);
    var html = '';
    for (var i = shown; i < next; i++) html += cardHtml(VISIBLE[i], i);
    container.insertAdjacentHTML('beforeend', html);
    shown = next;

    if (shown < VISIBLE.length) {
      container.insertAdjacentHTML('beforeend',
        '<button class="show-more" id="showMore" type="button">Show ' +
        Math.min(PAGE, VISIBLE.length - shown) + ' more · ' + (VISIBLE.length - shown) +
        ' remaining</button>');
      var btn = document.getElementById('showMore');
      btn.onclick = appendMore;
      // Also load as the button scrolls into view, so scrolling just works.
      if ('IntersectionObserver' in window) {
        sentinelObserver = new IntersectionObserver(function (entries) {
          if (entries.some(function (e) { return e.isIntersecting; })) {
            sentinelObserver.disconnect(); sentinelObserver = null; appendMore();
          }
        }, { rootMargin: '600px 0px' });
        sentinelObserver.observe(btn);
      }
    }
  }

  function cardParts(youth, index) {
    var days  = daysSince(youth.Latest_Followup);
    var state = flockState(days);

    var highlightClass = state === 'late' ? 'highlight-danger'
                       : state === 'warn' ? 'highlight-warning' : '';
    var daysClass  = state === 'late' ? 'days-late'  : state === 'warn' ? 'days-warn'  : 'days-ok';
    var badgeClass = state === 'late' ? 'status-danger' : state === 'warn' ? 'status-warning' : 'status-active';

    var daysText = days === null ? 'Not yet reached'
                 : days === 0    ? 'Reached today'
                 : days + ' days since last contact';
    var daysIcon = state === 'late' ? '🔴' : state === 'warn' ? '🟡' : '🟢';

    var phoneClean   = cleanPhone(youth.Mobile);
    var whatsappLink = phoneClean ? 'https://wa.me/' + phoneClean : '';
    var callLink     = phoneClean ? 'tel:' + phoneClean : '';

    var gpsHtml = '';
    if (youth.GPS) {
      gpsHtml = infoItemCustom('GPS',
        '<a class="gps-link" href="' + escHtml(gpsUrl(youth.GPS)) + '" target="_blank" rel="noopener">📍 Open in Maps</a>');
    }

    var socialLinks = [];
    if (youth.FB)        socialLinks.push('<a class="social-link social-fb" href="' + escHtml(youth.FB)        + '" target="_blank" rel="noopener">👤 Facebook</a>');
    if (youth.Instagram) socialLinks.push('<a class="social-link social-ig" href="' + escHtml(youth.Instagram) + '" target="_blank" rel="noopener">📷 Instagram</a>');
    var socialHtml = socialLinks.length ? '<div class="social-row">' + socialLinks.join('') + '</div>' : '';

    var notesHtml =
      '<div class="info-item full-item">' +
        '<div class="info-label">Notes</div>' +
        '<div class="notes-edit-row">' +
          '<textarea class="notes-textarea" id="notes_' + index + '" dir="auto" ' +
            (CAN_EDIT ? '' : 'readonly ') + 'placeholder="Add a note…">' + escHtml(youth.Notes || '') + '</textarea>' +
          (CAN_EDIT
            ? '<button class="notes-save-btn" id="notesbtn_' + index + '" type="button" ' +
              'onclick="saveNotes(' + index + ')">Save Notes</button>'
            : '') +
        '</div>' +
      '</div>';

    var followupHtml = CAN_EDIT
      ? '<div class="followup-box">' +
          '<div class="followup-toggle" onclick="toggleFollowup(this)">Record a Reach-Out</div>' +
          '<div class="followup-content">' +
            '<div class="followup-row">' +
              '<select id="type_' + index + '" class="follow-select">' +
                '<option value="WhatsApp">💬 WhatsApp</option>' +
                '<option value="Call">📞 Call</option>' +
                '<option value="Home Visit">🏠 Home Visit</option>' +
                '<option value="Outing">🚶 Outing</option>' +
              '</select>' +
            '</div>' +
            '<div class="followup-row">' +
              '<label class="success-toggle"><input type="checkbox" id="success_' + index + '" checked> Successful reach-out</label>' +
            '</div>' +
            '<button class="log-main-btn" id="savebtn_' + index + '" type="button" onclick="submitFollowUp(' + index + ')">' +
              '<div class="btn-spinner"></div><span class="btn-label">Save Log</span>' +
            '</button>' +
          '</div>' +
        '</div>'
      : '';

    var head =
      '<div class="card ' + highlightClass + '" data-i="' + index + '">' +
        '<div class="card-header" onclick="toggleCard(this)">' +
          '<div class="top-row">' +
            '<div class="name" dir="auto">' + escHtml(youth.Full_Name || '') +
              (BIRTHDAYS.indexOf(youth.Youth_ID) !== -1
                ? '<span class="cake" title="Birthday this week">🎂</span>' : '') + '</div>' +
            '<div class="badge ' + badgeClass + '">' + escHtml(youth.Status || 'Active') + '</div>' +
          '</div>' +
          '<div class="bottom-row">' +
            '<div class="days-badge ' + daysClass + '">' + daysIcon + ' ' + daysText + '</div>' +
            '<div class="expand-indicator">▼</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-content"></div>' +
      '</div>';

    var body =
          '<div class="info">' +
            '<div class="info-section-title">Contact</div>' +
            infoItem('Mobile',   youth.Mobile) +
            infoItem('Area',     youth.Area) +
            infoItemFull('Address', youth.Address) +
            gpsHtml + socialHtml +
            '<div class="info-section-title">Personal</div>' +
            infoItem('Year',       youth.Year) +
            infoItem('Birth Date', youth.Birth_Date) +
            infoItem('University', youth.University) +
            infoItem('Faculty',    youth.Faculty) +
            '<div class="info-section-title">Service &amp; Spiritual</div>' +
            infoItem('Service',         youth.Service) +
            infoItem('Confession',      youth.Confession) +
            infoItem('Talent',          youth.Talent) +
            infoItem('Talent Category', youth.Talent_Category) +
            '<div class="info-section-title">Follow-Up</div>' +
            infoItem('Last Contact', formatDate(youth.Latest_Followup)) +
            notesHtml +
          '</div>' +
          '<div class="button-row">' +
            (whatsappLink ? '<a class="btn whatsapp" href="' + whatsappLink + '" target="_blank" rel="noopener">💬 WhatsApp</a>' : '') +
            (callLink     ? '<a class="btn call" href="' + callLink + '">📞 Call</a>' : '') +
          '</div>' +
          followupHtml;

    return { head: head, body: body };
  }

  // The list only ever needs the header; the body is fetched when opened.
  function cardHtml(youth, index) { return cardParts(youth, index).head; }

  /* ── INFO ROW HELPERS ──────────────────────────────────────────────── */

  function infoItem(label, value) {
    if (value == null || value === '') return '';
    return '<div class="info-item"><div class="info-label">' + escHtml(label) + '</div>' +
           '<div class="info-value" dir="auto">' + escHtml(String(value)) + '</div></div>';
  }
  function infoItemFull(label, value) {
    if (value == null || value === '') return '';
    return '<div class="info-item full-item"><div class="info-label">' + escHtml(label) + '</div>' +
           '<div class="info-value" dir="auto">' + escHtml(String(value)) + '</div></div>';
  }
  function infoItemCustom(label, innerHtml) {
    if (!innerHtml) return '';
    return '<div class="info-item"><div class="info-label">' + escHtml(label) + '</div>' +
           '<div class="info-value" style="text-align:right">' + innerHtml + '</div></div>';
  }

  /* ── INTERACTION ───────────────────────────────────────────────────── */

  window.toggleCard = function (header) {
    var card = header.parentElement;
    var content = card.querySelector('.card-content');
    if (content && !content.firstChild) {
      var i = Number(card.getAttribute('data-i'));
      if (VISIBLE[i]) content.innerHTML = cardParts(VISIBLE[i], i).body;
    }
    card.classList.toggle('open');
  };

  window.toggleFollowup = function (element) {
    var c = element.nextElementSibling;
    c.style.display = c.style.display === 'block' ? 'none' : 'block';
  };

  window.submitFollowUp = function (index) {
    var youth = VISIBLE[index];
    if (!youth) return;
    var btn = document.getElementById('savebtn_' + index);
    if (!btn || btn.disabled) return;

    btn.disabled = true;
    btn.classList.add('loading');

    var reached = document.getElementById('success_' + index).checked;

    api('logFollowup', {
      youthId: youth.Youth_ID,
      type: document.getElementById('type_' + index).value,
      successful: reached
    }).then(function () {
      // Only a reach-out that landed moves anyone back into the fold, so say
      // so plainly — otherwise an unchanged card looks like a failed save.
      if (reached) {
        showToast('✔ Logged for ' + youth.Full_Name, '#5A7A5A');
      } else {
        showToast('Logged as not reached — ' + youth.Full_Name.split(/\s+/)[0] +
                  ' stays where they are', '#C07A1A');
      }
      setTimeout(function () {
        document.getElementById('reloadOverlay').classList.add('show');
        api('flock', FLOCK_REQUEST).then(function (data) {
          try {
            localStorage.setItem('the99.cache.' + FLOCK_CACHE_KEY,
              JSON.stringify({ at: Date.now(), data: data }));
          } catch (e) { /* ignore */ }
          document.getElementById('reloadOverlay').classList.remove('show');
          FLOCK = data.youths || [];
          renderSummary();
          renderCards();
        }).catch(function () {
          document.getElementById('reloadOverlay').classList.remove('show');
          showToast('Could not refresh', '#C07A1A');
        });
      }, 600);
    }).catch(function (err) {
      showToast('⚠ ' + err.message, '#963232');
      btn.disabled = false;
      btn.classList.remove('loading');
    });
  };

  window.saveNotes = function (index) {
    var youth = VISIBLE[index];
    if (!youth) return;
    var btn = document.getElementById('notesbtn_' + index);
    var textarea = document.getElementById('notes_' + index);
    if (!btn || btn.disabled) return;

    var newNotes = textarea.value.trim();
    btn.disabled = true;
    btn.textContent = 'Saving…';

    api('updateNotes', { youthId: youth.Youth_ID, notes: newNotes }).then(function () {
      youth.Notes = newNotes;                    // keep the local copy in step
      showToast('📝 Notes saved', '#5A7A5A');
      btn.textContent = 'Saved ✓';
      setTimeout(function () { btn.textContent = 'Save Notes'; btn.disabled = false; }, 2000);
    }).catch(function (err) {
      showToast('⚠ ' + err.message, '#963232');
      btn.textContent = 'Save Notes';
      btn.disabled = false;
    });
  };

  // Typing re-filters 450 youths cheaply, but re-rendering on every keystroke
  // is what used to stutter; a short debounce makes it feel instant.
  var searchTimer = null;
  document.getElementById('searchBox').addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderCards, 140);
  });
  ['sortBy', 'fYear', 'fGender', 'fServant'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', renderCards);
  });
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer
        onload="window.dispatchEvent(new Event('gsi-loaded'))"></script>
</body>
</html>
