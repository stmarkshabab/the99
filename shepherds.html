<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 99 — Shepherds</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3B2A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The 99">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/icon-192.png">
<!-- The first API call is the slowest thing on the page; warm the connection now. -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/the99.css">
</head>
<body class="page-shepherds">

<div class="gate" id="gate" hidden>
  <div class="gate-emblem">🐑</div>
  <div class="gate-brand">The 99</div>
  <div class="gate-sub">Shepherd Report</div>
  <div class="gate-verse" id="gate-verse"></div>
  <div class="gate-ref"   id="gate-ref"></div>
  <div class="gate-btn-wrap" id="gsi-button"></div>
  <p class="gate-note">Sign in with the Google account registered on the Servants sheet.</p>
  <p class="gate-error" id="gate-error" hidden></p>
</div>

<div id="app" hidden>

  <div class="offline-bar" id="offlineBar" hidden>⚠ You are offline</div>

  <div class="header">
    <div class="header-title">
      <span class="header-title__pad"></span>
      <span class="header-mark">
        <span class="header-emblem">🐑</span>
        <span class="header-brand">The 99</span>
      </span>
      <span class="header-tools" id="header-tools"></span>
    </div>
    <div class="header-sub">Shepherd Report</div>
    <nav class="nav" id="nav" hidden></nav>
  </div>

  <div class="main" id="main">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">Gathering the shepherds…</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="assets/the99.js"></script>
<script>
(function () {
  requireServant({ leaderOnly: true }).then(function () {
    apiCached('shepherds', 'shepherds', {}, buildPage, function (err) {
      document.getElementById('main').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><p>' + escHtml(err.message) + '</p></div>';
    });
  });

  /* ── FLOCK BY CLASS ─────────────────────────────────────────────────────
     Fold / Wandering / Lost for every year and gender. Each year gets a
     subtotal row with its genders beneath it, and the footer gives each gender
     across all years and then everyone, which must equal the Overall Flock
     figures above it — a built-in cross-check. */

  function classLabel(y) {
    return y === '4-5' ? 'Years 4 & 5' : y === '?' ? 'Year not set' : 'Year ' + y;
  }
  function yearOrder(y)   { return y === '?' ? 99 : y === '4-5' ? 4 : Number(y); }
  function genderOrder(g) { return g === 'Female' ? 0 : g === 'Male' ? 1 : 2; }

  function sumOf(list) {
    return list.reduce(function (a, c) {
      a.ok += c.ok; a.warn += c.warn; a.late += c.late; return a;
    }, { ok: 0, warn: 0, late: 0 });
  }

  function classBar(c) {
    var t = c.ok + c.warn + c.late;
    if (!t) return '';
    return '<div class="cls-bar" aria-hidden="true">' +
      (c.ok   ? '<span class="cls-seg cls-ok"   style="flex:' + c.ok   + '"></span>' : '') +
      (c.warn ? '<span class="cls-seg cls-warn" style="flex:' + c.warn + '"></span>' : '') +
      (c.late ? '<span class="cls-seg cls-late" style="flex:' + c.late + '"></span>' : '') +
      '</div>';
  }

  function classNums(c) {
    return '<td class="num n-ok">'   + c.ok   + '</td>' +
           '<td class="num n-warn">' + c.warn + '</td>' +
           '<td class="num n-late">' + c.late + '</td>' +
           '<td class="num">' + (c.ok + c.warn + c.late) + '</td>';
  }

  function buildClassTable(classes) {
    var byYear = {};
    classes.forEach(function (c) { (byYear[c.year] = byYear[c.year] || []).push(c); });

    var body = '';
    Object.keys(byYear).sort(function (a, b) { return yearOrder(a) - yearOrder(b); })
      .forEach(function (y) {
        var cells = byYear[y].slice().sort(function (a, b) {
          return genderOrder(a.gender) - genderOrder(b.gender);
        });
        var sum = sumOf(cells);
        body += '<tr class="cls-year"><td class="name-cell"><div class="cls-label">' +
                escHtml(classLabel(y)) + '</div>' + classBar(sum) + '</td>' + classNums(sum) + '</tr>';
        cells.forEach(function (c) {
          body += '<tr class="cls-sub"><td class="name-cell"><div class="cls-label">' +
                  escHtml(c.gender) + '</div>' + classBar(c) + '</td>' + classNums(c) + '</tr>';
        });
      });

    var byGender = {};
    classes.forEach(function (c) { (byGender[c.gender] = byGender[c.gender] || []).push(c); });
    var foot = '';
    Object.keys(byGender).sort(function (a, b) { return genderOrder(a) - genderOrder(b); })
      .forEach(function (g) {
        foot += '<tr class="cls-total"><td class="name-cell">All ' + escHtml(g.toLowerCase()) +
                '</td>' + classNums(sumOf(byGender[g])) + '</tr>';
      });
    foot += '<tr class="cls-total cls-everyone"><td class="name-cell">Everyone</td>' +
            classNums(sumOf(classes)) + '</tr>';

    var card = el('div', 'chart-card');
    card.innerHTML =
      '<div class="chart-header">' +
        '<div class="chart-title">Flock by Class</div>' +
        '<div class="chart-subtitle">In the Fold · Wandering · Lost Sheep, by year and gender</div>' +
      '</div>' +
      '<div style="overflow-x:auto"><table class="servant-table cls-table">' +
        '<thead><tr><th>Class</th>' +
          '<th class="num-h">Fold</th><th class="num-h">Wander</th>' +
          '<th class="num-h">Lost</th><th class="num-h">Total</th></tr></thead>' +
        '<tbody>' + body + foot + '</tbody></table></div>';
    return card;
  }

  function buildPage(data) {
    var main = document.getElementById('main');
    var servants = data.servants || [];

    main.innerHTML = '';

    /* ── OVERALL SUMMARY ── */
    var totalOk = 0, totalWarn = 0, totalLate = 0, totalLogs = 0;
    servants.forEach(function (d) {
      totalOk += d.ok; totalWarn += d.warn; totalLate += d.late; totalLogs += d.logs;
    });
    var youthCount = totalOk + totalWarn + totalLate;

    appendSection(main, 'Overall Flock');
    var g1 = el('div', 'stat-grid three');
    g1.innerHTML = statCard('ok',   totalOk,   'In the Fold') +
                   statCard('warn', totalWarn, 'Wandering')   +
                   statCard('late', totalLate, 'Lost Sheep');
    main.appendChild(g1);

    var unassigned = null;
    servants = servants.filter(function (d) {
      if (d.servant === 'Unassigned') { unassigned = d; return false; }
      return true;
    });
    var unassignedCount = unassigned ? unassigned.ok + unassigned.warn + unassigned.late : 0;

    var g2 = el('div', 'stat-grid three');
    g2.innerHTML = statCard('dark', youthCount, 'Total Shabab') +
                   statCard('dark', totalLogs,  'Reach-Outs') +
                   statCard(unassignedCount ? 'late' : 'dark', unassignedCount, 'Unassigned');
    main.appendChild(g2);

    /* ── BY CLASS ── */
    // Absent when the backend predates it; the rest of the page is unaffected.
    if (data.classes && data.classes.length) {
      appendSection(main, 'Flock by Class');
      main.appendChild(buildClassTable(data.classes));
    }

    /* ── SEARCH + CARDS ── */
    appendSection(main, 'Shepherds — tap to open');

    var searchWrap = el('div', 'search-wrap');
    searchWrap.innerHTML =
      '<input class="search-box" id="searchBox" type="search" dir="auto" ' +
      'placeholder="🔍  Search shepherd…" autocomplete="off">';
    main.appendChild(searchWrap);

    var listWrap = el('div', '');
    listWrap.id = 'servantList';
    listWrap.style.cssText = 'display:flex;flex-direction:column;gap:10px;margin-top:4px';

    /* Youths with no servant are not a shepherd, so they are not ranked —
       they sit at the top, in amber, because each one needs a decision. */
    if (unassigned && unassignedCount) {
      var ua = el('a', 'shepherd-card unassigned');
      ua.href = 'index.html?view=unassigned';
      ua.setAttribute('data-name', 'unassigned no servant');
      ua.innerHTML =
        '<div class="sc-inner">' +
          '<div class="sc-avatar">?</div>' +
          '<div class="sc-body">' +
            '<div class="sc-name">No servant yet</div>' +
            '<div class="sc-sub"><span>' + unassignedCount + ' youth' + (unassignedCount === 1 ? '' : 's') +
            ' waiting to be assigned — tap to see them</span></div>' +
          '</div>' +
          '<div class="sc-pills">' +
            '<div class="sc-total">' + unassignedCount + '</div>' +
            '<div class="sc-arrow">›</div>' +
          '</div>' +
        '</div>';
      listWrap.appendChild(ua);
    }

    servants.forEach(function (d) {
      var s = d.servant;
      var total = d.ok + d.warn + d.late;
      var pct = total > 0 ? Math.round(d.ok / total * 100) : 0;

      var borderClass = d.late > 0 ? 'has-late' : d.warn > 0 ? 'has-warn' : 'all-ok';
      var pctClass    = d.late > 0 ? 'late'     : d.warn > 0 ? 'warn'     : 'ok';

      var card = el('a', 'shepherd-card ' + borderClass);
      card.href = 'index.html?servant=' + encodeURIComponent(s);
      card.setAttribute('data-name', s.toLowerCase());
      card.innerHTML =
        '<div class="sc-inner">' +
          '<div class="sc-avatar">' + escHtml(initials(s)) + '</div>' +
          '<div class="sc-body">' +
            '<div class="sc-name" dir="auto">' + escHtml(s) + '</div>' +
            '<div class="sc-sub">' +
              '<span><span class="pill pill-total">' + total + '</span> youths</span>' +
              '<span><span class="pill pill-ok">'   + d.ok   + '</span> Fold</span>' +
              '<span><span class="pill pill-warn">' + d.warn + '</span> Wander</span>' +
              '<span><span class="pill pill-late">' + d.late + '</span> Lost</span>' +
            '</div>' +
          '</div>' +
          '<div class="sc-pills">' +
            '<div class="sc-pct ' + pctClass + '">' + pct + '%</div>' +
            '<div class="sc-arrow">›</div>' +
          '</div>' +
        '</div>';

      listWrap.appendChild(card);
    });

    main.appendChild(listWrap);

    document.getElementById('searchBox').addEventListener('input', function () {
      var q = this.value.toLowerCase().trim();
      Array.prototype.forEach.call(
        listWrap.querySelectorAll('.shepherd-card'), function (card) {
          card.style.display = (!q || card.getAttribute('data-name').indexOf(q) !== -1) ? '' : 'none';
        });
    });
  }
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer
        onload="window.dispatchEvent(new Event('gsi-loaded'))"></script>
</body>
</html>
